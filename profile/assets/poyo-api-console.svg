<svg width="980" height="320" viewBox="0 0 980 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PoYo AI API Console</title>
  <desc id="desc">PoYo AI model router hero showing one API request flowing to image, video, music, chat, and 3D model workflows.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="980" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="0.55" stop-color="#0D121B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="356" y1="160" x2="742" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pyMark" x1="54" y1="48" x2="108" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.55 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.52 0 0 0 0 0.8 0 0 0 0 0.09 0 0 0 0.45 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect x="10" y="10" width="960" height="300" rx="28" fill="url(#panel)"/>
  <rect x="10.5" y="10.5" width="959" height="299" rx="27.5" stroke="#1F2937"/>

  <g opacity="0.55">
    <path d="M42 242H292" stroke="#1F2937"/>
    <path d="M42 256H224" stroke="#111827"/>
    <path d="M42 270H260" stroke="#111827"/>
  </g>

  <g transform="translate(52 50)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#05070A" stroke="#1F2937"/>
    <path d="M16 15H35.5C44.5 15 50 20.2 50 28.1C50 36.1 44.5 41.2 35.5 41.2H25.8V29.6H34.3C37.3 29.6 39.2 28.1 39.2 25.9C39.2 23.6 37.3 22.2 34.3 22.2H16V15Z" fill="white"/>
    <path d="M16 41.2L29.9 27.3H42.5L28.6 41.2H16Z" fill="url(#pyMark)"/>
  </g>

  <text x="122" y="72" class="sans" fill="#F8FAFC" font-size="36" font-weight="800" letter-spacing="-0.2">PoYo AI</text>
  <text x="54" y="132" class="sans" fill="#E5E7EB" font-size="22" font-weight="650">One API key. Many AI model workflows.</text>
  <text x="54" y="164" class="sans" fill="#94A3B8" font-size="14">Production-ready task submission, polling, and webhooks for AI media apps.</text>

  <g transform="translate(54 194)">
    <rect x="0" y="0" width="132" height="38" rx="11" fill="#84CC16"/>
    <text x="23" y="24" class="sans" fill="#07110A" font-size="14" font-weight="800">Start Building</text>
    <rect x="144" y="0" width="105" height="38" rx="11" fill="#111827" stroke="#334155"/>
    <text x="169" y="24" class="sans" fill="#E2E8F0" font-size="14" font-weight="700">API Docs</text>
  </g>

  <g transform="translate(354 92)">
    <rect x="0" y="0" width="214" height="136" rx="18" fill="#070A0F" stroke="#1F2937"/>
    <rect x="14" y="14" width="186" height="30" rx="8" fill="#0F172A"/>
    <circle cx="30" cy="29" r="4" fill="#EF4444"/>
    <circle cx="44" cy="29" r="4" fill="#F59E0B"/>
    <circle cx="58" cy="29" r="4" fill="#84CC16"/>
    <text x="18" y="66" class="mono" fill="#22D3EE" font-size="14" font-weight="700">POST</text>
    <text x="64" y="66" class="mono" fill="#E5E7EB" font-size="14">/api/generate/submit</text>
    <text x="18" y="93" class="mono" fill="#64748B" font-size="12">Authorization: Bearer $KEY</text>
    <text x="18" y="116" class="mono" fill="#A7F3D0" font-size="12">task_id -> status -> result</text>
  </g>

  <g filter="url(#softGlow)">
    <path d="M568 160C606 160 620 100 662 100" stroke="url(#cyanLine)" stroke-width="3"/>
    <path d="M568 160C608 160 626 136 662 136" stroke="url(#cyanLine)" stroke-width="3"/>
    <path d="M568 160H662" stroke="url(#cyanLine)" stroke-width="3"/>
    <path d="M568 160C608 160 626 184 662 184" stroke="url(#cyanLine)" stroke-width="3"/>
    <path d="M568 160C606 160 620 220 662 220" stroke="url(#cyanLine)" stroke-width="3"/>
  </g>
  <circle cx="568" cy="160" r="5" fill="#22D3EE" filter="url(#softGlow)"/>

  <g class="sans" font-weight="760">
    <g transform="translate(662 76)">
      <rect width="138" height="48" rx="14" fill="#101827" stroke="#243044"/>
      <circle cx="21" cy="24" r="7" fill="#22D3EE"/>
      <text x="42" y="30" fill="#F8FAFC" font-size="16">Image</text>
    </g>
    <g transform="translate(662 124)">
      <rect width="138" height="48" rx="14" fill="#101827" stroke="#243044"/>
      <circle cx="21" cy="24" r="7" fill="#A78BFA"/>
      <text x="42" y="30" fill="#F8FAFC" font-size="16">Video</text>
    </g>
    <g transform="translate(662 172)">
      <rect width="138" height="48" rx="14" fill="#101827" stroke="#243044"/>
      <circle cx="21" cy="24" r="7" fill="#84CC16" filter="url(#greenGlow)"/>
      <text x="42" y="30" fill="#F8FAFC" font-size="16">Music</text>
    </g>
    <g transform="translate(822 100)">
      <rect width="104" height="48" rx="14" fill="#101827" stroke="#243044"/>
      <circle cx="21" cy="24" r="7" fill="#38BDF8"/>
      <text x="42" y="30" fill="#F8FAFC" font-size="16">Chat</text>
    </g>
    <g transform="translate(822 196)">
      <rect width="104" height="48" rx="14" fill="#101827" stroke="#243044"/>
      <circle cx="21" cy="24" r="7" fill="#C084FC"/>
      <text x="42" y="30" fill="#F8FAFC" font-size="16">3D</text>
    </g>
  </g>

  <g transform="translate(354 252)">
    <rect x="0" y="0" width="572" height="34" rx="12" fill="#090D14" stroke="#1F2937"/>
    <text x="18" y="22" class="mono" fill="#67E8F9" font-size="12">POYO_BASE_URL</text>
    <circle cx="142" cy="17" r="3" fill="#334155"/>
    <text x="158" y="22" class="mono" fill="#D9F99D" font-size="12">Task IDs</text>
    <circle cx="252" cy="17" r="3" fill="#334155"/>
    <text x="268" y="22" class="mono" fill="#E9D5FF" font-size="12">Polling</text>
    <circle cx="360" cy="17" r="3" fill="#334155"/>
    <text x="376" y="22" class="mono" fill="#BFDBFE" font-size="12">Webhooks</text>
    <circle cx="498" cy="17" r="4" fill="#84CC16" filter="url(#greenGlow)"/>
    <text x="512" y="22" class="mono" fill="#CBD5E1" font-size="12">ready</text>
  </g>
</svg>
